# Checks that the README's "Getting started" steps work on Windows, macOS and Linux:
# install, run the tests, build, and start the dev server and load the page.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: npm install (as in the README)
        run: npm install
      - run: npm test
      - run: npm run build
      - name: npm run dev serves the app
        shell: bash
        run: |
          npm run dev > dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ -o page.html; then break; fi
            sleep 1
          done
          cat dev.log
          grep -q '<div id="root">' page.html
          curl -sf http://localhost:5173/src/main.tsx -o /dev/null
          echo "dev server OK"
